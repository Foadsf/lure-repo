name: test-fritzing
on:
  push:
    branches: [ci-test-fritzing]
jobs:
  lure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {repository: Foadsf/lure, path: lure}
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - run: cd lure && CGO_ENABLED=0 go build -o ../lure-bin .
      - uses: actions/upload-artifact@v4
        with: {name: lure-bin, path: lure-bin}
  build:
    needs: lure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:rolling', 'debian:testing', 'archlinux:latest', 'fedora:latest']
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - name: Base tools (root)
        run: |
          if command -v apt-get >/dev/null; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y sudo git ca-certificates curl; fi
          if command -v pacman >/dev/null; then pacman -Syu --noconfirm sudo git base-devel; fi
          if command -v dnf >/dev/null; then dnf install -y sudo git; fi
          useradd -m -s /bin/bash builder
          echo 'builder:builder' | chpasswd
          chage -E -1 -M -1 builder || true
          # CI container only: Fedora's sudo fails PAM account checks for the throwaway user
          [ -f /etc/pam.d/sudo ] && sed -i '1i account sufficient pam_permit.so' /etc/pam.d/sudo || true
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: lure-bin, path: /usr/local/bin}
      - name: Probe package names and pre-install build deps
        shell: bash
        run: |
          if command -v pacman >/dev/null; then pacman -Ss 'polyclipping|clipper|ngspice|quazip' | grep -v '^ ' ; fi
          if command -v dnf >/dev/null; then dnf repoquery --qf '%{name}\n' 'ngspice*' 'polyclipping*' 'clipper*' 'quazip*' 2>/dev/null | sort -u; fi
          d=$(. /etc/os-release; echo $ID)
          case "$d" in
            ubuntu|debian) var=build_deps_debian ;;
            fedora) var=build_deps_fedora ;;
            arch) var=build_deps_arch ;;
          esac
          pkgs=$(bash -c 'source fritzing/lure.sh; declare -n a=$0; echo "${a[@]}"' "$var")
          echo "pre-installing: $pkgs"
          case "$d" in
            ubuntu|debian) DEBIAN_FRONTEND=noninteractive apt-get install -y $pkgs ;;
            fedora) dnf install -y --skip-unavailable $pkgs ;;
            arch) pacman -S --noconfirm --needed $(echo $pkgs | sed 's/polyclipping//') ;;
          esac
      - name: lure build as non-root
        run: |
          chmod +x /usr/local/bin/lure-bin
          cp -r "$GITHUB_WORKSPACE" /home/builder/repo
          chown -R builder /home/builder/repo
          su builder -c 'cd ~/repo/fritzing && /usr/local/bin/lure-bin build -s lure.sh' 2>&1 | tail -150
          find /home/builder -name '*fritzing*' \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar*' \) | tee /tmp/pkgs
          test -s /tmp/pkgs
      - name: Install and run
        run: |
          pkg=$(head -1 /tmp/pkgs)
          if command -v apt-get >/dev/null; then apt-get install -y "$pkg"; fi
          if command -v pacman >/dev/null; then pacman -U --noconfirm "$pkg"; fi
          if command -v dnf >/dev/null; then dnf install -y "$pkg"; fi
          ls /usr/share/fritzing /usr/share/fritzing/fritzing-parts | head -30
          test -f /usr/share/fritzing/fritzing-parts/parts.db
          QT_QPA_PLATFORM=offscreen Fritzing -version
